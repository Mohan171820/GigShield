server.port=${PORT:8080}
server.address=0.0.0.0

# Database 
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL Initialization 
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# External API Keys
gigshield.api.weatherbit.key=9e215c6cf22747d088837317710de3e5
gigshield.api.weatherbit.base-url=https://api.weatherbit.io/v2.0

gigshield.api.iqair.key=${IQAIR_API_KEY:MOCK}
gigshield.api.iqair.base-url=https://api.airvisual.com/v2

gigshield.api.mock-mode=false

logging.level.com.gigshield=DEBUG

gigshield.payment.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_PLACEHOLDER}
gigshield.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:PLACEHOLDER_SECRET}
gigshield.payment.sandbox-mode=true

gigshield.api.ml.base-url=${GIGSHIELD_ML_URL:http://26.62.114.156:5000/predict}
gigshield.api.ml.mock-mode=true

# Enrollment Suspension Feature Flag
# Set to true ONLY when demonstrating high-risk zone blocking (demo mode)
# Defaults to false so normal registration always works
gigshield.features.enrollment-suspension.enabled=${ENROLLMENT_SUSPENSION_ENABLED:false}
