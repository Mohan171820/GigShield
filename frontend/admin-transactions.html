<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InSureGig — Admin Transactions</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Data Export Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
  <style>
    body { background: #f4f5f7; }
    .navbar-admin-tag { background: var(--accent-bg); color: var(--accent); border-radius: 999px; padding: 3px 10px; font-size: .72rem; font-weight: 700; text-transform: uppercase; margin-left: 10px; }
  </style>
</head>
<body>

<script>
  if (sessionStorage.getItem('gsRole') !== 'admin') {
    location.replace('login.html');
  }
</script>

<nav class="navbar">
  <div class="flex-center gap-8">
    <a href="dashboard.html" class="navbar-brand">InSureGig</a>
    <span class="navbar-admin-tag">Admin</span>
  </div>
  <ul class="navbar-links">
    <li><a href="dashboard.html">Analytics</a></li>
    <li><a href="admin-workers.html">Workers</a></li>
    <li><a href="admin-transactions.html" class="active">Transactions</a></li>
    <li><a href="admin-complaints.html">Complaints</a></li>
    <li>
      <a href="login.html" onclick="sessionStorage.clear()" style="color:var(--danger)">Logout</a>
    </li>
  </ul>
</nav>

<div class="page-wrapper">
  <div class="container" style="max-width:1200px">

    <div class="flex-between mb-24 flex-wrap gap-16">
      <div>
        <h1 style="font-size:1.8rem;margin-bottom:4px">Transactions</h1>
        <p class="text-muted text-sm">Live stream of insurance payouts and claims.</p>
      </div>
      <div class="flex-center gap-8 flex-wrap">
        <button class="btn btn-sm btn-outline" onclick="downloadExcel()">
          <span style="margin-right:4px">📊</span> Excel
        </button>
        <button class="btn btn-sm btn-outline" onclick="downloadPDF()">
          <span style="margin-right:4px">📄</span> PDF
        </button>
        <button class="btn btn-sm btn-secondary" onclick="loadTransactions()">↻ Refresh Feed</button>
      </div>
    </div>

    <div class="card" style="background:#fff;border:none;box-shadow:0 1px 4px rgba(0,0,0,.06)">
      <div class="table-wrapper">
        <table id="txnTable">
          <thead>
            <tr>
              <th>Date / Time</th>
              <th>Transfer ID (Razorpay)</th>
              <th>Worker ID</th>
              <th>Type / Event</th>
              <th>Amount</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="txnTbody">
            <tr><td colspan="6" class="text-center text-muted" style="padding:32px">Loading transactions...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script src="app.js"></script>
<script>
  let currentTransactions = [];
  
  // PDF Library Shim for UMD compatibility
  if (window.jspdf && window.jspdf.jsPDF) {
    window.jsPDF = window.jspdf.jsPDF;
  }

  async function loadTransactions() {
    const tbody = document.getElementById('txnTbody');
    try {
      const data = await apiGet('/api/v1/payouts');
      currentTransactions = data || [];
      
      if (!currentTransactions.length) {
        tbody.innerHTML = `<tr><td colspan="6" style="padding:32px;text-align:center">
          <div class="empty-state" style="padding:24px">
            <div class="ei">📊</div><p>No transactions recorded yet.</p>
          </div></td></tr>`;
        return;
      }

      // Sort newest first
      const sorted = [...currentTransactions].sort((a,b) => new Date(b.createdAt || b.created_at || 0) - new Date(a.createdAt || a.created_at || 0));

      tbody.innerHTML = sorted.map(p => {
         const date = fmtDate(p.createdAt || p.created_at);
         const time = fmtTime(p.createdAt || p.created_at);
         const type = (p.triggerType || p.trigger_type || 'PAYOUT').replace(/_/g, ' ');
         const rzp = p.razorpayPayoutId || p.razorpay_payout_id || '—';
         
         return `
          <tr>
            <td class="text-sm"><span class="fw-600">${date}</span> <span class="text-muted">${time}</span></td>
            <td class="mono text-muted text-xs">${rzp}</td>
            <td class="fw-600">#${p.workerId || p.worker_id || '—'}</td>
            <td>Payout / ${type}</td>
            <td class="text-success fw-600">₹${p.amount || 0}</td>
            <td>${statusBadge(p.status)}</td>
          </tr>
         `;
      }).join('');
    } catch (_) {
      tbody.innerHTML = `<tr><td colspan="6" class="text-muted text-sm text-center" style="padding:24px">Could not load transactions from server.</td></tr>`;
    }
  }

  function downloadExcel() {
    if (!currentTransactions.length) return alert('No data to export.');
    
    try {
      // Manual row mapping with strict character sanitization
      const rows = currentTransactions.map(p => ({
        'Date': fmtDate(p.createdAt || p.created_at),
        'Time': fmtTime(p.createdAt || p.created_at),
        'Transfer ID': (p.razorpayPayoutId || p.razorpay_payout_id || '—').toString(),
        'Worker ID': `#${(p.workerId || p.worker_id || '—')}`,
        'Type': (p.triggerType || p.trigger_type || 'PAYOUT').replace(/_/g, ' '),
        'Amount (Rs)': parseFloat(p.amount || 0),
        'Status': p.status || '—'
      }));

      const worksheet = XLSX.utils.json_to_sheet(rows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Transactions");
      
      // Standard sheetjs download which is broadly compatible
      XLSX.writeFile(workbook, `InSureGig_Transactions_${new Date().toISOString().split('T')[0]}.xlsx`);
    } catch (err) {
      console.error('Excel Export Error:', err);
      alert('Failed to generate Excel file. Check console for details.');
    }
  }

  function downloadPDF() {
    if (!currentTransactions.length) return alert('No data to export.');
    
    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(18);
      doc.text("InSureGig - Insurance Transactions", 14, 20);
      doc.setFontSize(10);
      doc.setTextColor(100);
      doc.text(`Generated on: ${new Date().toLocaleString()}`, 14, 28);

      // Explicit data mapping to ensure only standard characters are in the PDF
      const tableData = currentTransactions.map(p => [
        `${fmtDate(p.createdAt || p.created_at)} ${fmtTime(p.createdAt || p.created_at)}`,
        (p.razorpayPayoutId || p.razorpay_payout_id || '—').toString(),
        `Worker #${p.workerId || p.worker_id || '—'}`,
        (p.triggerType || p.trigger_type || 'PAYOUT').replace(/_/g, ' '),
        `Rs. ${p.amount || 0}`,
        p.status || '—'
      ]);

      if (typeof doc.autoTable !== 'function') {
        alert("PDF Table extension failed to load. Please refresh.");
        return;
      }

      doc.autoTable({
        startY: 35,
        head: [['Date / Time', 'Transfer ID', 'Worker ID', 'Type', 'Amount', 'Status']],
        body: tableData,
        theme: 'striped',
        headStyles: { fillColor: [45, 85, 255] },
        styles: { fontSize: 8, font: 'helvetica' }
      });

      doc.save(`InSureGig_Transactions_${new Date().toISOString().split('T')[0]}.pdf`);
    } catch (err) {
      console.error('PDF Export Error:', err);
      alert('Failed to generate PDF file. Check console for details.');
    }
  }

  loadTransactions();
</script>
</body>
</html>
