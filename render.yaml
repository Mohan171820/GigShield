# GigShield Render Blueprint
services:
  - type: web
    name: gigshield-backend
    runtime: docker
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: gigshield-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: gigshield-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: gigshield-db
          property: password
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_SQL_INIT_MODE
        value: always
      # Manual Keys (Set these in Render Dashboard for security)
      - key: GIGSHIELD_API_ML_MOCK_MODE
        value: "true"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

databases:
  - name: gigshield-db
    plan: free
    region: singapore
    postgresMajorVersion: 15
